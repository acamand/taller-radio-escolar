<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monta el estudio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Caveat:wght@700&display=swap">
<style>
/* Layout: una columna centrada tipo "consola de estudio"; cabecera fija con progreso por colores de función */
:root{
  --bg:#F5F2EB; --bg2:#EAE4D6; --card:#FCFBF8; --ink:#16181D; --soft:#4A4F5A; --line:#D9D2C2;
  --blue:#2563EB; --yellow:#F6B800; --green:#12804A; --red:#D7303A; --mesa:#23262E; --ondark:#C9CCD3;
  --okbg:#E3F3EA; --kobg:#FBE4E5;
  --display:'Montserrat',Arial,sans-serif; --hand:'Caveat','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181D; --bg2:#1E2127; --card:#23262E; --ink:#F2EFE8; --soft:#AEB2BC; --line:#3A3E48;
  --mesa:#0E0F12; --okbg:#173527; --kobg:#3D1C1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181D; --bg2:#1E2127; --card:#23262E; --ink:#F2EFE8; --soft:#AEB2BC; --line:#3A3E48;
  --mesa:#0E0F12; --okbg:#173527; --kobg:#3D1C1F; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}

/* cabecera */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-weight:800;letter-spacing:-.3px;font-size:17px;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 22%,transparent)}
.recording .dot{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.score{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:30px;white-space:nowrap}
.mesatag{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--soft)}
.prog{display:flex;gap:5px;margin-top:10px}
.prog i{flex:1;height:7px;border-radius:4px;background:var(--line);transition:background .3s}

/* tipografía */
h1{font-size:clamp(40px,8vw,72px);font-weight:900;line-height:.98;letter-spacing:-2px;margin:0;text-wrap:balance}
h2{font-size:clamp(26px,5vw,38px);font-weight:800;line-height:1.08;letter-spacing:-.8px;margin:0;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase}
.lead{font-size:18px;color:var(--soft);max-width:60ch;margin:0}
.hand{font-family:var(--hand);font-weight:700}
.muted{color:var(--soft)}

/* portada */
.hero{display:grid;gap:22px;padding-block:28px 8px}
.stripe{height:10px;border-radius:5px;width:220px;background:linear-gradient(90deg,var(--blue) 0 25%,var(--yellow) 25% 50%,var(--green) 50% 75%,var(--red) 75%)}
.recseal{display:inline-flex;align-items:center;gap:10px;align-self:start;justify-self:start;background:var(--red);color:#fff;font-weight:900;letter-spacing:2px;font-size:14px;padding:9px 18px 9px 14px;border-radius:40px;text-transform:uppercase}
.recseal::before{content:"";width:12px;height:12px;border-radius:50%;background:#fff}
.mesas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:6px}
.mesa{display:grid;gap:10px;text-align:left;padding:14px;border-radius:18px;border:2px solid var(--line);background:var(--card);transition:transform .15s,border-color .15s}
.mesa:hover{transform:translateY(-3px);border-color:var(--ink)}
.mesa img{width:100%;aspect-ratio:1.25;object-fit:contain;background:#fff;border-radius:10px}
.mesa b{font-size:20px;font-weight:800}
.mesa span{font-size:14px;color:var(--soft)}
.retos{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.retos li{font-size:13px;font-weight:700;padding:6px 12px;border-radius:30px;background:var(--bg2)}

/* tarjeta de reto */
.stage{display:grid;gap:18px;padding-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3.5vw,28px);display:grid;gap:18px}
.q{font-size:clamp(19px,3.4vw,23px);font-weight:700;line-height:1.3;margin:0;text-wrap:balance}
.count{font-size:13px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}

/* opciones */
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:600;font-size:16px;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--bg2)}
.opt.ok{border-color:var(--green);background:var(--okbg)}
.opt.ok .k{background:var(--green);color:#fff}
.opt.ko{border-color:var(--red);background:var(--kobg)}
.opt.ko .k{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:14px 16px;display:grid;gap:4px;font-size:16px}
.fb.ok{background:var(--okbg)}
.fb.ko{background:var(--kobg)}
.fb .hand{font-size:28px;line-height:1}
.fb.ok .hand{color:var(--green)}
.fb.ko .hand{color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:40px;padding:13px 22px;font-weight:800;font-size:15px;background:var(--ink);color:var(--bg)}
.btn.rec{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--ink);color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:default}

/* clasificar por colores */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.tok{border:2px solid var(--ink);background:var(--card);border-radius:30px;padding:9px 15px;font-weight:700;font-size:15px}
.tok.sel{background:var(--ink);color:var(--bg)}
.tok.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bin{border:0;border-radius:16px;padding:12px;min-height:118px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;color:#fff}
.bin b{font-size:20px;font-weight:900;letter-spacing:-.3px}
.bin small{font-size:12.5px;opacity:.9;font-weight:600}
.bin.blue{background:var(--blue)}
.bin.yellow{background:var(--yellow);color:#16181D}
.bin.green{background:var(--green)}
.bin.red{background:var(--red)}
.bin .in{display:flex;flex-wrap:wrap;gap:5px}
.bin .in span{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.92);color:#16181D;border-radius:20px;padding:3px 9px}
.bins.armed .bin{outline:3px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:3px}

/* ordenar */
.seq{display:grid;gap:8px;counter-reset:n}
.slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:2px dashed var(--line);min-height:52px;font-weight:700}
.slot.filled{border-style:solid;border-color:var(--green);background:var(--okbg)}
.slot .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);font-size:13px;font-weight:800}
.slot.filled .n{background:var(--green);color:#fff}

/* esquema de conexiones */
.diagram{width:100%;max-width:640px;justify-self:center}
.diagram svg{width:100%;height:auto;display:block}
.diagram text{font-family:var(--display);font-weight:800}

/* mesa interactiva */
.panel{background:var(--mesa);border-radius:18px;padding:16px;display:grid;gap:16px;color:#F2EFE8}
.panel h4{margin:0;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ondark);font-weight:800}
.ctrls{display:flex;flex-wrap:wrap;gap:14px 10px}
.knob{background:none;border:0;display:grid;justify-items:center;gap:6px;width:74px;padding:4px 0;color:#F2EFE8}
.knob .dial{width:50px;height:50px;border-radius:50%;position:relative;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 4px #33363F;transition:transform .25s}
.knob .dial::after{content:"";position:absolute;left:50%;top:4px;width:4px;height:17px;margin-left:-2px;border-radius:2px;background:#16181D}
.knob.light .dial::after{background:#16181D}
.knob.darkc .dial::after{background:#fff}
.knob .lbl{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-align:center;line-height:1.15}
.knob .pos{font-size:11px;color:var(--ondark);font-weight:600}
.ctrl.wrong .dial,.ctrl.wrong .pbtn,.ctrl.wrong .track{box-shadow:0 0 0 4px var(--red)}
.ctrl.right .dial,.ctrl.right .pbtn,.ctrl.right .track{box-shadow:0 0 0 4px #3FCF7F}
.pushwrap{background:none;border:0;display:grid;justify-items:center;gap:6px;width:84px;padding:4px 0;color:#F2EFE8}
.pbtn{width:44px;height:30px;border-radius:7px;background:#C9CCD3;box-shadow:0 5px 0 #6B6F7A;transform:translateY(0);transition:transform .12s,box-shadow .12s,background .12s;position:relative}
.pbtn::after{content:"";position:absolute;left:50%;top:-11px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#3A3E48}
.pushwrap[aria-pressed="true"] .pbtn{transform:translateY(4px);box-shadow:0 1px 0 #6B6F7A}
.pushwrap[aria-pressed="true"] .pbtn::after{background:#FF4A4A;box-shadow:0 0 8px #FF4A4A}
.pushwrap.redb .pbtn{background:#D7303A;box-shadow:0 5px 0 #7D1B21}
.pushwrap.redb[aria-pressed="true"] .pbtn{box-shadow:0 1px 0 #7D1B21}
.pushwrap.orangeb .pbtn{background:#F08A24;box-shadow:0 5px 0 #8C4C10}
.pushwrap.orangeb[aria-pressed="true"] .pbtn{box-shadow:0 1px 0 #8C4C10}
.pushwrap .lbl,.fader .lbl{font-size:11.5px;font-weight:800;text-align:center;line-height:1.15}
.pushwrap .pos,.fader .pos{font-size:11px;color:var(--ondark);font-weight:600}
.fader{background:none;border:0;display:grid;justify-items:center;gap:6px;width:84px;padding:4px 0;color:#F2EFE8}
.track{width:12px;height:96px;border-radius:6px;background:#0A0B0D;position:relative;box-shadow:0 0 0 2px #33363F}
.track i{position:absolute;left:50%;width:34px;height:20px;margin-left:-17px;border-radius:4px;background:var(--c);transition:top .25s;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.legend{font-size:13px;color:var(--soft);margin:0}

/* final */
.final{display:grid;gap:20px;justify-items:start;padding-top:28px}
.seal{width:min(250px,64vw);aspect-ratio:1;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;text-align:center;box-shadow:0 0 0 10px var(--bg),0 0 0 13px var(--red);transform:rotate(-8deg);justify-self:center}
.seal div{display:grid;gap:2px}
.seal b{font-size:clamp(38px,9vw,54px);font-weight:900;line-height:.9;letter-spacing:-1px}
.seal span{font-size:13px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase}
.seal .hand{font-size:30px;letter-spacing:0;text-transform:none}
.levels{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%}
.levels li{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600}
.levels li b{font-variant-numeric:tabular-nums}
.review{display:grid;gap:10px;width:100%}
.review div{padding:12px 14px;border-left:5px solid var(--red);background:var(--card);border-radius:0 12px 12px 0;font-size:15px}
.review div b{display:block;margin-bottom:2px}

@media (min-width:1200px){html{zoom:1.3}.wrap{max-width:1180px}.card.duo{grid-template-columns:1.1fr 1fr;align-items:center;column-gap:36px}.card.duo>.row,.card.duo>.fb{grid-column:1/-1}.panel .ctrls{zoom:1.15;gap:14px 22px}.panel{grid-template-columns:auto 1fr;column-gap:40px}}
@media (min-width:1700px){html{zoom:1.6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.knob{width:64px}.pushwrap,.fader{width:72px}}
</style>
</head>
<body>

<header class="top" id="top" hidden>
  <div class="wrap" style="padding-block:0">
    <div class="toprow">
      <div class="brand"><span class="dot"></span><span>Monta el estudio</span><span class="mesatag" id="mesatag"></span></div>
      <div style="display:flex;gap:8px;align-items:center"><button class="score" id="fs" style="border:0;background:var(--bg2);color:var(--ink)" aria-label="Pantalla completa">⛶</button><div class="score" id="score">0 pts</div></div>
    </div>
    <div class="prog" id="prog"></div>
  </div>
</header>

<main class="wrap" id="app"></main>

/* ---------- estado ---------- */
let S={};
function nuevo(m){
  S={mesa:m,L:niveles(m),li:0,ri:0,pts:0,max:0,porNivel:[],fallos:[],intento:0};
  S.porNivel=S.L.map(()=>({p:0,m:0}));
}
const app=document.getElementById('app');
const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function sumar(ok,pts=1){
  S.max+=pts; S.porNivel[S.li].m+=pts;
  if(ok){S.pts+=pts;S.porNivel[S.li].p+=pts}
  pintaCabecera();
}
function fallo(q,why){S.fallos.push({q,why})}

function pintaCabecera(){
  const top=document.getElementById('top');
  if(!S.L){top.hidden=true;return}
  top.hidden=false;
  document.getElementById('mesatag').textContent=S.mesa==='efx8'?'EFX8':'PA-8';
  document.getElementById('score').textContent=S.pts+' pts';
  const p=document.getElementById('prog');p.innerHTML='';
  S.L.forEach((n,i)=>{const e=document.createElement('i');
    if(i<S.li||S.fin)e.style.background=n.color; else if(i===S.li)e.style.background='color-mix(in srgb,var(--ink) 40%,transparent)';
    e.title=n.titulo;p.appendChild(e)});
  document.body.classList.toggle('recording',!S.fin);
}

/* ---------- portada ---------- */
function portada(){
  S={};pintaCabecera();
  const retos=niveles('efx8').map(n=>`<li>${esc(n.titulo)}</li>`).join('');
  app.innerHTML='';
  app.appendChild($(`<section class="hero">
    <span class="recseal">Dale al rec</span>
    <h1>Monta el estudio</h1>
    <div class="stripe" aria-hidden="true"></div>
    <p class="lead">Tres retos para repasar lo de hoy: conectar el estudio, preparar la mesa y resolver lo que falla. Cada acierto a la primera suma un punto.</p>
    <ul class="retos" aria-label="Retos">${retos}</ul>
    <p class="eyebrow" style="margin-top:8px">¿Qué mesa tienes en tu centro?</p>
    <div class="mesas">
      <button class="mesa" data-m="efx8"><img src="${IMG.efx8}" alt="Mesa de mezclas Soundcraft EFX8"><b>Soundcraft EFX8</b><span>Ocho canales, faders blancos y botón PHANTOM rojo</span></button>
      <button class="mesa" data-m="pa8"><img src="${IMG.pa8}" alt="Mesa de mezclas Depusheng PA-8"><b>Depusheng PA-8</b><span>Laterales verdes, faders MAIN rojos y botón PHANTOM naranja</span></button>
    </div>
  </section>`));
  app.querySelectorAll('.mesa').forEach(b=>b.onclick=()=>{nuevo(b.dataset.m);ronda()});
}

/* ---------- motor de rondas ---------- */
function ronda(){
  const N=S.L[S.li]; const R=N.rondas[S.ri];
  pintaCabecera(); S.intento=0;
  app.innerHTML='';
  const st=$(`<section class="stage"><div class="row"><p class="eyebrow" style="margin:0">Reto ${S.li+1} de ${S.L.length}</p><span class="count">${N.rondas.length>1?`${S.ri+1} / ${N.rondas.length}`:''}</span></div><h2>${esc(N.titulo)}</h2></section>`);
  const card=$('<div class="card"></div>'); st.appendChild(card); app.appendChild(st);
  ({sort:rSort,order:rOrder,quiz:rQuiz,panel:rPanel})[R.tipo](R,card);
  window.scrollTo({top:0,behavior:'smooth'});
}
function siguiente(card,txt){
  const b=$(`<div class="row" style="justify-content:flex-end"><button class="btn rec">${txt||'Siguiente'}</button></div>`);
  card.appendChild(b); const btn=b.querySelector('button'); btn.focus({preventScroll:true});
  btn.onclick=()=>{S.ri++; if(S.ri>=S.L[S.li].rondas.length){S.ri=0;S.li++} if(S.li>=S.L.length)final(); else ronda()};
}
function fb(card,ok,why,titulo){
  card.appendChild($(`<div class="fb ${ok?'ok':'ko'}" role="status"><span class="hand">${titulo||(ok?'¡Eso es!':'Casi…')}</span><span>${esc(why)}</span></div>`));
}

/* test */
function rQuiz(R,card){
  let host=card;
  if(R.link){card.classList.add('duo');card.appendChild(diagrama(R.link));host=$('<div style="display:grid;gap:16px;min-width:0"></div>');card.appendChild(host)}
  host.appendChild($(`<p class="q">${esc(R.q)}</p>`));
  const orden=shuffle(R.opts.map((t,i)=>({t,i})));
  const box=$('<div class="opts"></div>');host.appendChild(box);
  orden.forEach((o,k)=>{
    const b=$(`<button class="opt"><span class="k">${'ABC'[k]}</span><span${R.mono?' style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px"':''}>${esc(o.t)}</span></button>`);
    b.onclick=()=>{
      const ok=o.i===R.ok;
      if(!ok){b.classList.add('ko');b.disabled=true;
        if(S.intento===0){sumar(false);fallo(R.q,R.opts[R.ok]+'. '+R.why)}
        S.intento++; return}
      b.classList.add('ok');
      if(S.intento===0)sumar(true);
      box.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      fb(card,S.intento===0,R.why,S.intento===0?null:'Ahora sí');
      siguiente(card);
    };
    box.appendChild(b);
  });
}

/* clasificar */
function rSort(R,card){
  card.appendChild($(`<p class="q">${esc(R.q)}</p>`));
  const pool=$('<div class="pool"></div>');
  const bins=$('<div class="bins"></div>');
  card.appendChild(pool);card.appendChild(bins);
  let sel=null,quedan=R.items.length,errores=0;
  const binEls={};
  R.bins.forEach(bn=>{const e=$(`<button class="bin ${bn.c}"><b>${bn.t}</b><small>${bn.d}</small><span class="in"></span></button>`);
    e.onclick=()=>{
      if(!sel)return;
      const [txt,dest]=sel.item;
      if(dest===bn.id){
        e.querySelector('.in').appendChild($(`<span>${esc(txt)}</span>`));
        if(!sel.err)sumar(true);
        sel.el.remove();sel=null;bins.classList.remove('armed');quedan--;
        if(quedan===0){fb(card,errores===0,'Azul capta, amarillo escucha, verde graba y rojo es ¡ojo!',errores===0?'¡Todo en su sitio!':'Todo en su sitio');siguiente(card)}
      }else{
        sel.el.classList.remove('shake');void sel.el.offsetWidth;sel.el.classList.add('shake');
        if(!sel.err){sel.err=true;errores++;sumar(false);fallo(`¿De qué color es «${txt}»?`,R.why[dest])}
        const t=card.querySelector('.fb.tmp');if(t)t.remove();
        const f=$(`<div class="fb ko tmp" role="status"><span class="hand">Ahí no</span><span>Piensa para qué sirve «${esc(txt)}».</span></div>`);
        card.insertBefore(f,pool);
      }
    };
    binEls[bn.id]=e;bins.appendChild(e)});
  shuffle(R.items).forEach(it=>{
    const t=$(`<button class="tok">${esc(it[0])}</button>`);
    const o={el:t,item:it,err:false};
    t.onclick=()=>{pool.querySelectorAll('.tok').forEach(x=>x.classList.remove('sel'));
      const tmp=card.querySelector('.fb.tmp');if(tmp)tmp.remove();
      if(sel===o){sel=null;bins.classList.remove('armed');return}
      sel=o;t.classList.add('sel');bins.classList.add('armed')};
    pool.appendChild(t)});
}

/* ordenar */
function rOrder(R,card){
  card.appendChild($(`<p class="q">${esc(R.q)}</p>`));
  const seq=$('<div class="seq"></div>');
  const slots=R.items.map((_,i)=>{const s=$(`<div class="slot"><span class="n">${i+1}</span><span class="muted">…</span></div>`);seq.appendChild(s);return s});
  const pool=$('<div class="pool"></div>');
  card.appendChild(pool);card.appendChild(seq);
  let k=0,err=false;
  shuffle(R.items).forEach(txt=>{
    const t=$(`<button class="tok">${esc(txt)}</button>`);
    t.onclick=()=>{
      if(txt===R.items[k]){
        slots[k].classList.add('filled');slots[k].lastElementChild.textContent=txt;slots[k].lastElementChild.className='';
        t.remove();k++;
        if(k===R.items.length){sumar(!err,2);if(err)fallo(R.q,R.items.join(' → ')+'. '+R.why);fb(card,!err,R.why,err?'En orden':null);siguiente(card)}
      }else{
        t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');err=true;
      }
    };
    pool.appendChild(t)});
}

/* esquema de conexiones (SVG) */
function diagrama(act){
  const N=(x,y,w,t,c,tc)=>`<g><rect x="${x}" y="${y}" width="${w}" height="44" rx="12" fill="${c}"/><text x="${x+w/2}" y="${y+28}" text-anchor="middle" font-size="17" fill="${tc}">${t}</text></g>`;
  const L=(id,d,lbl,lx,ly)=>{const on=id===act;const col=on?'var(--red)':'var(--line)';
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${on?6:4}" stroke-linecap="round" ${on?'stroke-dasharray="10 8"':''}>${on?'<animate attributeName="stroke-dashoffset" from="36" to="0" dur="1s" repeatCount="indefinite"/>':''}</path>
    <text x="${lx}" y="${ly}" text-anchor="middle" font-size="15" fill="${on?'var(--red)':'var(--soft)'}">${on?'¿?':lbl}</text>`};
  return $(`<div class="diagram" aria-hidden="true"><svg viewBox="0 0 420 262">
    ${L('mic','M95 54 L170 110','XLR',112,92)}
    ${L('usb','M325 54 L250 110','USB',308,92)}
    ${L('amp','M250 154 L325 210','Jack',308,178)}
    ${L('hp','M240 232 L180 232','',210,224)}
    ${L('pwr','M135 132 L20 132','Corriente',70,124)}
    ${N(10,10,170,'Micros × 4','var(--blue)','#fff')}
    ${N(135,110,150,'Mesa','var(--ink)','var(--bg)')}
    ${N(240,10,170,'Ordenador','var(--green)','#fff')}
    ${N(240,210,170,'Amplificador','var(--yellow)','#16181D')}
    ${N(10,210,170,'Auriculares × 4','var(--yellow)','#16181D')}
  </svg></div>`);
}

/* mesa interactiva */
function rPanel(R,card){
  const P=PANELES[R.mesa];
  card.appendChild($(`<p class="q">${esc(P.intro)}</p>`));
  const panel=$('<div class="panel"></div>');card.appendChild(panel);
  const st={};
  P.grupos.forEach(g=>{
    const grp=$(`<div style="display:grid;gap:10px"><h4>${esc(g.t)}</h4><div class="ctrls"></div></div>`);
    const box=grp.querySelector('.ctrls');
    g.ctrls.forEach(c=>{
      st[c.id]={c,v:c.v};
      let e;
      if(c.k==='knob'){
        e=$(`<button class="knob ctrl ${c.light?'light':''}"><span class="dial" style="--c:${c.c}"></span><span class="lbl">${esc(c.l)}</span><span class="pos"></span></button>`);
        const up=()=>{e.querySelector('.dial').style.transform=`rotate(${ANG[st[c.id].v]}deg)`;e.querySelector('.pos').textContent=POS[st[c.id].v];e.setAttribute('aria-label',`${c.l}: ${POS[st[c.id].v]}. Toca para girar`)};
        e.onclick=()=>{st[c.id].v=(st[c.id].v+1)%5;e.classList.remove('wrong','right');up()};up();
      }else if(c.k==='push'){
        e=$(`<button class="pushwrap ctrl ${c.cls||''}"><span class="pbtn"></span><span class="lbl">${esc(c.l)}</span><span class="pos"></span></button>`);
        const up=()=>{e.setAttribute('aria-pressed',st[c.id].v);e.querySelector('.pos').textContent=st[c.id].v?'pulsado':'suelto'};
        e.onclick=()=>{st[c.id].v=!st[c.id].v;e.classList.remove('wrong','right');up()};up();
      }else{
        e=$(`<button class="fader ctrl"><span class="track"><i style="--c:${c.c}"></i></span><span class="lbl">${esc(c.l)}</span><span class="pos"></span></button>`);
        const up=()=>{e.querySelector('i').style.top=st[c.id].v?'4px':'72px';e.querySelector('.pos').textContent=st[c.id].v?'arriba':'abajo';e.setAttribute('aria-label',`${c.l}: ${st[c.id].v?'arriba':'abajo'}. Toca para moverlo`)};
        e.onclick=()=>{st[c.id].v=!st[c.id].v;e.classList.remove('wrong','right');up()};up();
      }
      st[c.id].el=e;box.appendChild(e);
    });
    panel.appendChild(grp);
  });
  card.appendChild($(`<p class="legend">Toca una rueda para girarla: cerrada → a las 10 → a las 12 → a las 2 → a tope.</p>`));
  const row=$('<div class="row" style="justify-content:flex-end"><button class="btn rec">Comprobar</button></div>');card.appendChild(row);
  const total=Object.keys(st).length;let intentos=0;
  row.querySelector('button').onclick=()=>{
    intentos++;
    card.querySelectorAll('.fb').forEach(f=>f.remove());
    const malos=[];
    Object.values(st).forEach(s=>{const ok=s.v===s.c.ok;s.el.classList.toggle('wrong',!ok);s.el.classList.toggle('right',ok);if(!ok)malos.push(s)});
    if(intentos===1){const bien=total-malos.length;S.max+=5;S.porNivel[S.li].m+=5;const p=Math.round(5*bien/total);S.pts+=p;S.porNivel[S.li].p+=p;pintaCabecera();
      if(malos.length)fallo(`Preparar la ${P.titulo}`,P.regla)}
    if(malos.length){
      const whys=malos.length<=3?[...new Set(malos.map(s=>s.c.why))].join(' '):'Los marcados en rojo no están bien. Pista: '+P.regla;
      const f=$(`<div class="fb ko" role="status"><span class="hand">${malos.length===1?'Te queda 1':'Te quedan '+malos.length}</span><span>${esc(whys)}</span></div>`);
      card.insertBefore(f,row);
    }else{
      row.remove();
      fb(card,intentos===1,P.regla,intentos===1?'¡Mesa lista a la primera!':'¡Mesa lista!');
      siguiente(card);
    }
  };
}

/* ---------- final ---------- */
function final(){
  S.fin=true;pintaCabecera();
  const pct=S.max?Math.round(100*S.pts/S.max):0;
  const msg=pct>=85?'Estudio listo. Ya puedes darle al rec.':pct>=60?'Casi todo en su sitio. Repasa lo de abajo y a grabar.':'Buen primer montaje. Repasa lo de abajo y vuelve a intentarlo.';
  const otra=S.mesa==='efx8'?'pa8':'efx8';
  app.innerHTML='';
  const f=$(`<section class="final">
    <div class="seal" aria-label="Puntuación ${S.pts} de ${S.max}"><div><span>● Rec</span><b>${S.pts}/${S.max}</b><span class="hand">dale al rec</span></div></div>
    <h2>${msg}</h2>
    <ul class="levels">${S.L.map((n,i)=>`<li><span>${esc(n.titulo)}</span><b>${S.porNivel[i].p} / ${S.porNivel[i].m}</b></li>`).join('')}</ul>
    ${S.fallos.length?`<p class="eyebrow" style="margin:6px 0 0">Para repasar</p><div class="review">${S.fallos.map(x=>`<div><b>${esc(x.q)}</b>${esc(x.why)}</div>`).join('')}</div>`:''}
    <div class="row" style="justify-content:flex-start">
      <button class="btn rec" id="again">Jugar otra vez</button>
      <button class="btn ghost" id="other">Probar con la ${otra==='efx8'?'EFX8':'PA-8'}</button>
      <button class="btn ghost" id="home">Cambiar de mesa</button>
    </div>
  </section>`);
  app.appendChild(f);
  f.querySelector('#again').onclick=()=>{nuevo(S.mesa);ronda()};
  f.querySelector('#other').onclick=()=>{nuevo(otra);ronda()};
  f.querySelector('#home').onclick=portada;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
portada();
</script>
